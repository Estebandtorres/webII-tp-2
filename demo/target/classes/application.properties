spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Conexión a PostgreSQL (con los mismos datos del docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/tp2_db?options=-c%20TimeZone=UTC
spring.datasource.username=mi_usuario
spring.datasource.password=mi_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/tp2_db?options=-c%20TimeZone=UTC
spring.flyway.user=mi_usuario
spring.flyway.password=mi_password